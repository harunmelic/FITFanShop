<div class="newsletter-section">
  <div class="newsletter-container">
    <div class="newsletter-content">
      <h2>STAY UPDATED</h2>
      <p>Stay informed about new articles, discounts, and more via email...</p>
    </div>
    <div class="newsletter-form">
      <input 
        type="email" 
        [(ngModel)]="email"
        placeholder="Enter your email address"
        class="email-input">
      <button (click)="onSubmit()" class="submit-btn">SEND</button>
    </div>
  </div>
</div>
