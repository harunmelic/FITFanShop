<div class="newsletter-section">
  <div class="newsletter-container">
    <div class="newsletter-content">
      <h2>BUDITE OBAVIJEŠTENI</h2>
      <p>Na mail ćete biti obaviješteni o novim artiklima, popustima...</p>
    </div>
    <div class="newsletter-form">
      <input 
        type="email" 
        [(ngModel)]="email"
        placeholder="Unesite vašu mail adresu"
        class="email-input">
      <button (click)="onSubmit()" class="submit-btn">POŠALJI</button>
    </div>
  </div>
</div>
