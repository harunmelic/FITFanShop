<div class="products-slider-section">
  <div class="section-header">
    <h2>{{ slides[currentSlide].title }}</h2>
    <a href="#" class="go-to-shop">GO TO SHOP</a>
  </div>

  <div class="slider-container">
    <div class="products-slide" 
         *ngFor="let slide of slides; let i = index"
         [class.active]="i === currentSlide">
      <div class="products-grid">
        <div class="product-card" *ngFor="let product of slide.products">
          <div class="product-image">
            <div class="placeholder"></div>
            
            <!-- Variant Selector Overlay -->
            <div class="variant-selector-overlay" *ngIf="showVariantSelector === product.id">
              <div class="variant-selector-content" (click)="$event.stopPropagation()">
                <button class="close-btn" (click)="closeVariantSelector()">×</button>
                <h4>{{ product.name }}</h4>
                <p class="selector-label">Dostupne veličine:</p>
                <div class="variant-buttons">
                  <button 
                    *ngFor="let variant of product.variants"
                    class="variant-btn"
                    [class.selected]="isVariantSelected(product.id, variant.id)"
                    [class.out-of-stock]="variant.stockQuantity === 0"
                    [disabled]="variant.stockQuantity === 0"
                    (click)="selectVariant(product.id, variant.id)">
                    {{ variant.size }}
                    <span class="stock-badge" *ngIf="variant.stockQuantity > 0 && variant.stockQuantity <= 5">
                      ({{ variant.stockQuantity }})
                    </span>
                  </button>
                </div>
              </div>
            </div>
            
            <button class="add-to-cart" (click)="addToCart(product); $event.stopPropagation()">
              ODABERI VELIČINU 📏
            </button>
          </div>
          <div class="product-info">
            <h3>{{ product.name }}</h3>
            <div class="product-variants" *ngIf="product.variants && product.variants.length > 0">
              <span class="variants-label">Veličine:</span>
              <div class="variants-sizes">
                <span *ngFor="let variant of product.variants" 
                      class="size-badge"
                      [class.out-of-stock]="variant.stockQuantity === 0">
                  {{ variant.size }}
                </span>
              </div>
            </div>
            <p class="price">{{ product.price }}KM</p>
          </div>
        </div>
      </div>
    </div>

    <button class="arrow arrow-left" (click)="prevSlide()">‹</button>
    <button class="arrow arrow-right" (click)="nextSlide()">›</button>
  </div>

  <div class="dots">
    <span *ngFor="let slide of slides; let i = index" 
          class="dot" 
          [class.active]="i === currentSlide"
          (click)="goToSlide(i)">
    </span>
  </div>
</div>
