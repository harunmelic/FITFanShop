<div class="hero-slider">
  <div class="slider-container">
    <div class="slide" 
         *ngFor="let slide of slides; let i = index" 
         [class.active]="i === currentSlide"
         [style.background-color]="slide.bgColor">
      <div class="slide-content">
        <div class="text-content">
          <h1>{{ slide.title }}<br>{{ slide.subtitle }}</h1>
          <button class="slide-btn" (click)="onSlideButtonClick(slide)">{{ slide.buttonText }}</button>
        </div>
        <div class="image-content" *ngIf="slide.image">
          <img [src]="slide.image" [alt]="slide.title">
        </div>
      </div>
    </div>
  </div>

  <button class="arrow arrow-left" (click)="prevSlide()">‹</button>
  <button class="arrow arrow-right" (click)="nextSlide()">›</button>

  <div class="dots">
    <span *ngFor="let slide of slides; let i = index" 
          class="dot" 
          [class.active]="i === currentSlide"
          (click)="goToSlide(i)">
    </span>
  </div>
</div>
