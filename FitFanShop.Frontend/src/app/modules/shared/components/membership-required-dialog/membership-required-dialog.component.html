<div class="membership-dialog">
  <div class="dialog-content">
    <div class="icon-section">
      <mat-icon class="lock-icon">lock</mat-icon>
    </div>
    <h2>POSTANI ČLAN</h2>
    <p class="message">Uživaj u ekskluzivnim proizvodima i visokim popustima!</p>
  </div>
  
  <div class="dialog-actions">
    <button mat-raised-button color="primary" class="member-btn" (click)="becomeMember()">
      POSTANI ČLAN
    </button>
    <button mat-button class="cancel-btn" (click)="close()">
      Odustani
    </button>
  </div>
</div>
