<div class="edit-user-dialog">
  <div class="dialog-header">
    <h2>Edit User</h2>
  </div>

  <div class="dialog-content">
    <form [formGroup]="userForm" class="user-form">
      <!-- First Name -->
      <div class="form-group">
        <label>First Name *</label>
        <input type="text" formControlName="firstName" placeholder="Enter first name">
        <span class="error-message" *ngIf="f['firstName'].touched && f['firstName'].hasError('required')">
          First name is required
        </span>
        <span class="error-message" *ngIf="f['firstName'].touched && f['firstName'].hasError('minlength')">
          First name must be at least 2 characters
        </span>
      </div>

      <!-- Last Name -->
      <div class="form-group">
        <label>Last Name *</label>
        <input type="text" formControlName="lastName" placeholder="Enter last name">
        <span class="error-message" *ngIf="f['lastName'].touched && f['lastName'].hasError('required')">
          Last name is required
        </span>
        <span class="error-message" *ngIf="f['lastName'].touched && f['lastName'].hasError('minlength')">
          Last name must be at least 2 characters
        </span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email *</label>
        <input type="email" formControlName="email" placeholder="Enter email address">
        <span class="error-message" *ngIf="f['email'].touched && f['email'].hasError('required')">
          Email is required
        </span>
        <span class="error-message" *ngIf="f['email'].touched && f['email'].hasError('email')">
          Please enter a valid email address
        </span>
      </div>

      <!-- Role -->
      <div class="form-group">
        <label>Role *</label>
        <select formControlName="role">
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
        <span class="error-message" *ngIf="f['role'].touched && f['role'].hasError('required')">
          Role is required
        </span>
      </div>

      <!-- Is Active -->
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="isActive">
          <span>User is active</span>
        </label>
      </div>
    </form>
  </div>

  <div class="dialog-actions">
    <button class="btn btn-cancel" (click)="onCancel()" [disabled]="isSubmitting">
      Cancel
    </button>
    <button class="btn btn-save" (click)="onSubmit()" [disabled]="isSubmitting">
      <span *ngIf="!isSubmitting">Update</span>
      <span *ngIf="isSubmitting">Updating...</span>
    </button>
  </div>
</div>
