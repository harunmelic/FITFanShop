<div class="add-product-dialog">
  <div class="dialog-header">
    <h2>Dodaj novi proizvod</h2>
  </div>
  
  <div class="dialog-content">
    <form [formGroup]="productForm" class="product-form">
      <div class="form-row">
        <!-- Name -->
        <div class="form-group">
          <label>Naziv proizvoda *</label>
          <input type="text" formControlName="name" placeholder="Unesite naziv proizvoda">
          <span class="error-message" *ngIf="f['name'].touched && f['name'].hasError('required')">
            Naziv je obavezan
          </span>
          <span class="error-message" *ngIf="f['name'].touched && f['name'].hasError('minlength')">
            Naziv mora imati najmanje 3 karaktera
          </span>
        </div>

        <!-- Price -->
        <div class="form-group">
          <label>Cijena *</label>
          <div class="input-with-prefix">
            <span class="prefix">KM</span>
            <input type="number" formControlName="price" placeholder="0.00">
          </div>
          <span class="error-message" *ngIf="f['price'].touched && f['price'].hasError('required')">
            Cijena je obavezna
          </span>
          <span class="error-message" *ngIf="f['price'].touched && f['price'].hasError('min')">
            Cijena mora biti veća ili jednaka 0
          </span>
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label>Opis</label>
        <textarea formControlName="description" rows="2" placeholder="Unesite opis proizvoda"></textarea>
      </div>

      <div class="form-row">
        <!-- Stock -->
        <div class="form-group">
          <label>Zalihe</label>
          <input type="number" formControlName="stock" placeholder="0">
          <span class="error-message" *ngIf="f['stock'].touched && f['stock'].hasError('min')">
            Zalihe moraju biti veće ili jednake 0
          </span>
        </div>

        <!-- Category ID -->
        <div class="form-group">
          <label>ID kategorije</label>
          <input type="number" formControlName="categoryId" placeholder="Unesite ID kategorije">
        </div>
      </div>

      <!-- Image URL -->
      <div class="form-group">
        <label>URL slike</label>
        <input type="text" formControlName="imageUrl" placeholder="https://primjer.com/slika.jpg">
      </div>
    </form>
  </div>

  <div class="dialog-actions">
    <button class="btn btn-cancel" (click)="onCancel()" [disabled]="isSubmitting">
      Otkaži
    </button>
    <button class="btn btn-save" (click)="onSubmit()" [disabled]="isSubmitting">
      <span *ngIf="!isSubmitting">Sačuvaj</span>
      <span *ngIf="isSubmitting">Čuvanje...</span>
    </button>
  </div>
</div>
