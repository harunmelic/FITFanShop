<div class="edit-product-dialog">
  <div class="dialog-header">
    <h2>Edit Product</h2>
  </div>
  
  <div class="dialog-content">
    <form [formGroup]="productForm" class="product-form">
      <div class="form-row">
        <!-- Name -->
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" formControlName="name" placeholder="Enter product name">
          <span class="error-message" *ngIf="f['name'].touched && f['name'].hasError('required')">
            Name is required
          </span>
          <span class="error-message" *ngIf="f['name'].touched && f['name'].hasError('minlength')">
            Name must be at least 3 characters
          </span>
        </div>

        <!-- Price -->
        <div class="form-group">
          <label>Price *</label>
          <div class="input-with-prefix">
            <span class="prefix">€</span>
            <input type="number" formControlName="price" placeholder="0.00">
          </div>
          <span class="error-message" *ngIf="f['price'].touched && f['price'].hasError('required')">
            Price is required
          </span>
          <span class="error-message" *ngIf="f['price'].touched && f['price'].hasError('min')">
            Price must be greater than or equal to 0
          </span>
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label>Description</label>
        <textarea formControlName="description" rows="2" placeholder="Enter product description"></textarea>
      </div>

      <!-- Size Stock Quantities -->
      <div class="form-group full-width">
        <label>Stock Quantity by Size</label>
        
        <!-- One Size products (like scarves, bags, etc.) -->
        <div *ngIf="!hasMultipleSizes" class="size-input-single">
          <label for="sizeOneSize">Stock Quantity (One Size)</label>
          <input id="sizeOneSize" type="number" formControlName="sizeOneSize" placeholder="0">
        </div>

        <!-- Multi-size products (like t-shirts, hoodies, etc.) -->
        <div *ngIf="hasMultipleSizes" class="sizes-grid">
          <div class="size-input">
            <label for="sizeS">Size S</label>
            <input id="sizeS" type="number" formControlName="sizeS" placeholder="0">
          </div>
          <div class="size-input">
            <label for="sizeM">Size M</label>
            <input id="sizeM" type="number" formControlName="sizeM" placeholder="0">
          </div>
          <div class="size-input">
            <label for="sizeL">Size L</label>
            <input id="sizeL" type="number" formControlName="sizeL" placeholder="0">
          </div>
          <div class="size-input">
            <label for="sizeXL">Size XL</label>
            <input id="sizeXL" type="number" formControlName="sizeXL" placeholder="0">
          </div>
          <div class="size-input">
            <label for="sizeXXL">Size XXL</label>
            <input id="sizeXXL" type="number" formControlName="sizeXXL" placeholder="0">
          </div>
        </div>
      </div>

      <div class="form-row">
        <!-- Stock Unit -->
        <div class="form-group">
          <label for="stockUnit">Stock Unit</label>
          <input id="stockUnit" type="text" formControlName="stockUnit" placeholder="pcs">
        </div>
      </div>

      <div class="form-row">
        <!-- Category -->
        <div class="form-group">
          <label for="categoryId">Category *</label>
          <select id="categoryId" formControlName="categoryId">
            <option [ngValue]="null" disabled>Select category</option>
            <option *ngFor="let category of categories" [ngValue]="category.id">
              {{ category.name }} (ID: {{ category.id }})
            </option>
          </select>
          <span class="error-message" *ngIf="f['categoryId'].touched && f['categoryId'].hasError('required')">
            Category is required
          </span>
        </div>
      </div>

      <!-- Image URL -->
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" formControlName="imageUrl" placeholder="https://example.com/image.jpg">
      </div>

      <!-- Is Enabled -->
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" formControlName="isEnabled">
          <span>Product is active</span>
        </label>
      </div>
    </form>
  </div>

  <div class="dialog-actions">
    <button class="btn btn-cancel" (click)="onCancel()" [disabled]="isSubmitting">
      Cancel
    </button>
    <button class="btn btn-save" (click)="onSubmit()" [disabled]="isSubmitting">
      <span *ngIf="!isSubmitting">Update</span>
      <span *ngIf="isSubmitting">Updating...</span>
    </button>
  </div>
</div>
