<!-- Loading Screen -->
<app-loading-screen></app-loading-screen>

<!-- Global Loading Bar (shown during HTTP requests) -->
<app-fit-loading-bar></app-fit-loading-bar>

<!-- Navbar -->
<app-navbar *ngIf="!isAdminRoute"></app-navbar>

<!-- Main Application Container -->
<div class="main-content" [class.no-navbar]="isAdminRoute">
  <router-outlet></router-outlet>
</div>

<!-- Footer (only if not admin route) -->
<app-footer *ngIf="!isAdminRoute"></app-footer>

<!-- Scroll to Top Button (only if not admin route) -->
<app-scroll-to-top *ngIf="!isAdminRoute"></app-scroll-to-top>

<!-- Cart Sidebar (global) -->
<app-cart-sidebar></app-cart-sidebar>
