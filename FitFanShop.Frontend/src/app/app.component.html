<!-- Loading Screen -->
<app-loading-screen></app-loading-screen>

<!-- Global Loading Bar (shown during HTTP requests) -->
<app-fit-loading-bar></app-fit-loading-bar>

<!-- Navbar -->
<app-navbar *ngIf="!isAdminRoute"></app-navbar>

<!-- Cart Sidebar -->
<app-cart-sidebar *ngIf="!isAdminRoute"></app-cart-sidebar>

<div [style.padding-top]="isAdminRoute ? '0' : '70px'">
  <!-- Main Application Container -->
  <router-outlet></router-outlet>

  <!-- Footer -->
  <app-footer *ngIf="!isAdminRoute"></app-footer>
</div>

<!-- Scroll to Top Button -->
<app-scroll-to-top *ngIf="!isAdminRoute"></app-scroll-to-top>
