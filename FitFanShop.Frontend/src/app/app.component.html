<!-- Loading Screen (globalno) -->
<app-loading-screen></app-loading-screen>

<!-- Global Loading Bar (shown during HTTP requests) -->
<app-fit-loading-bar></app-fit-loading-bar>

<!-- Landing Page Components (samo ako nije admin ruta) -->
<ng-container *ngIf="!isAdminRoute">
  <!-- Navbar -->
  <app-navbar></app-navbar>

  <!-- Hero Slider -->
  <app-hero-slider></app-hero-slider>

  <!-- Features Section -->
  <app-features-section></app-features-section>

  <!-- Products Slider -->
  <app-products-slider></app-products-slider>

  <!-- Membership Banner -->
  <app-membership-banner></app-membership-banner>

  <!-- Testimonials Section -->
  <app-testimonials-section></app-testimonials-section>

  <!-- Newsletter Section -->
  <app-newsletter-section></app-newsletter-section>
</ng-container>

<!-- Main Application Container -->
<router-outlet></router-outlet>

<!-- Footer (samo ako nije admin ruta) -->
<app-footer *ngIf="!isAdminRoute"></app-footer>

<!-- Scroll to Top Button (samo ako nije admin ruta) -->
<app-scroll-to-top *ngIf="!isAdminRoute"></app-scroll-to-top>
